name: Speaker compatibility report
description: Tell us whether AirplayFox works with your speaker
labels: ["compatibility"]
body:
  - type: input
    id: speaker
    attributes:
      label: Speaker model
      placeholder: HomePod mini, other AirPlay 2 speaker
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Speaker firmware / software version
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with problems
        - Listed but will not connect
        - Not listed
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Latency that worked, anything odd, and the log (%APPDATA%\AirplayFox\airplayfox.log) if it failed.
